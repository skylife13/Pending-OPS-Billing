<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBNI Ops Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
/* ===== SBNI Ops Center — design tokens ===== */
:root{
  color-scheme:light;
  --page:#f9f9f7;
  --surface:#fcfcfb;
  --surface-2:#f1f0ec;
  --surface-3:#e8e7e1;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --border:rgba(11,11,11,0.10);
  --border-strong:rgba(11,11,11,0.16);
  --grid:#e1e0d9;
  --baseline:#c3c2b7;
  --accent:#2a78d6;
  --accent-ink:#ffffff;
  --accent-soft:rgba(42,120,214,0.10);
  --accent-2:#eb6834;
  --accent-2-soft:rgba(235,104,52,0.12);
  --good:#0ca30c;
  --good-soft:rgba(12,163,12,0.12);
  --warning:#c98500;
  --warning-soft:rgba(237,161,0,0.16);
  --critical:#d03b3b;
  --critical-soft:rgba(208,59,59,0.12);
  --risk-1:#0ca30c;
  --risk-2:#57a208;
  --risk-3:#a2a204;
  --risk-4:#eda100;
  --risk-5:#e37f14;
  --risk-6:#da5d27;
  --risk-7:#d03b3b;
  --shadow-sm:0 1px 2px rgba(11,11,11,0.06);
  --shadow-md:0 8px 24px -8px rgba(11,11,11,0.16);
  --shadow-pop:0 16px 40px -12px rgba(11,11,11,0.28);
  --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --rail-w:236px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d;
    --surface:#181817;
    --surface-2:#212120;
    --surface-3:#2a2a28;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#8f8d86;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18);
    --grid:#2c2c2a;
    --baseline:#3a3a37;
    --accent:#3987e5;
    --accent-ink:#ffffff;
    --accent-soft:rgba(57,135,229,0.16);
    --accent-2:#e07136;
    --accent-2-soft:rgba(224,113,54,0.18);
    --good:#0ca30c;
    --good-soft:rgba(12,163,12,0.18);
    --warning:#fab219;
    --warning-soft:rgba(250,178,25,0.18);
    --critical:#e66767;
    --critical-soft:rgba(230,103,103,0.18);
    --risk-1:#0ca30c;
    --risk-2:#5ba810;
    --risk-3:#abad15;
    --risk-4:#fab219;
    --risk-5:#f39933;
    --risk-6:#ed804d;
    --risk-7:#e66767;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px -8px rgba(0,0,0,0.5);
    --shadow-pop:0 16px 40px -12px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;
  --surface:#181817;
  --surface-2:#212120;
  --surface-3:#2a2a28;
  --text-primary:#ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:#8f8d86;
  --border:rgba(255,255,255,0.10);
  --border-strong:rgba(255,255,255,0.18);
  --grid:#2c2c2a;
  --baseline:#3a3a37;
  --accent:#3987e5;
  --accent-ink:#ffffff;
  --accent-soft:rgba(57,135,229,0.16);
  --accent-2:#e07136;
  --accent-2-soft:rgba(224,113,54,0.18);
  --good:#0ca30c;
  --good-soft:rgba(12,163,12,0.18);
  --warning:#fab219;
  --warning-soft:rgba(250,178,25,0.18);
  --critical:#e66767;
  --critical-soft:rgba(230,103,103,0.18);
  --risk-1:#0ca30c;
  --risk-2:#5ba810;
  --risk-3:#abad15;
  --risk-4:#fab219;
  --risk-5:#f39933;
  --risk-6:#ed804d;
  --risk-7:#e66767;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 8px 24px -8px rgba(0,0,0,0.5);
  --shadow-pop:0 16px 40px -12px rgba(0,0,0,0.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:var(--text-primary)}
a{color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ===== Loading ===== */
#boot-loading{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;
  background:var(--page);
}

/* ===== Login ===== */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(57,135,229,0.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(235,104,52,0.10), transparent 40%),
    #0d0f12;
  padding:24px;
  position:relative;
  overflow:hidden;
}
.login-wrap svg.route-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.login-card{
  position:relative;
  width:100%;max-width:392px;
  background:#14161a;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:36px 32px 30px;
  box-shadow:var(--shadow-pop);
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#3987e5,#2a5fb0);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 14px rgba(57,135,229,0.4);
}
.login-brand .mark svg{width:19px;height:19px}
.login-brand .wordmark{color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-0.01em}
.login-brand .tagline{color:#8b93a1;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.login-card h1{color:#fff;font-size:21px;margin-bottom:4px}
.login-sub{color:#8b93a1;font-size:13px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#a7adb8;margin-bottom:6px;letter-spacing:.02em}
.field input{
  width:100%;padding:11px 13px;border-radius:9px;
  background:#0d0f12;border:1px solid rgba(255,255,255,0.12);
  color:#fff;transition:border-color .15s;
}
.field input::placeholder{color:#565d68}
.field input:focus{border-color:#3987e5}
.login-btn{
  width:100%;padding:12px;border-radius:9px;border:none;margin-top:6px;
  background:#3987e5;color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  transition:background .15s, transform .05s;
}
.login-btn:hover{background:#2f74cc}
.login-btn:active{transform:translateY(1px)}
.login-error{
  margin-top:14px;padding:10px 12px;border-radius:8px;
  background:rgba(230,103,103,0.14);border:1px solid rgba(230,103,103,0.3);
  color:#f0a3a3;font-size:12.5px;display:none;
}
.login-error.show{display:block}
.login-foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);color:#5d6470;font-size:11.5px;line-height:1.6}

/* ===== App shell ===== */
#app-shell{display:flex;min-height:100vh}
.rail{
  width:var(--rail-w);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.rail-brand .mark{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#2a5fb0);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(57,135,229,0.35);
}
.rail-brand .mark svg{width:17px;height:17px;color:#fff}
.rail-brand .wordmark{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:-0.01em}
.rail-brand .tagline{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.rail-nav{flex:1;padding:8px 12px;overflow-y:auto}
.rail-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;padding:14px 10px 6px}
.rail-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--text-secondary);font-size:13.5px;font-weight:600;cursor:pointer;
  border:1px solid transparent;margin-bottom:2px;
}
.rail-link svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
.rail-link:hover{background:var(--surface-2);color:var(--text-primary)}
.rail-link.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(57,135,229,0.22)}
.rail-link.active svg{opacity:1}
.rail-foot{padding:14px;border-top:1px solid var(--border)}
.rail-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.rail-user .avatar{
  width:32px;height:32px;border-radius:50%;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
  flex-shrink:0;font-family:var(--font-display);color:var(--text-secondary);
}
.rail-user .who{min-width:0;flex:1}
.rail-user .name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-user .role{font-size:10.5px;color:var(--text-muted);text-transform:capitalize}
.rail-logout{
  margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.rail-logout svg{width:14px;height:14px;flex-shrink:0}
.rail-logout:hover{background:var(--surface-2);color:var(--text-primary)}

.rail-toggle{
  display:none;position:fixed;top:14px;left:14px;z-index:50;
  width:38px;height:38px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow-sm);align-items:center;justify-content:center;cursor:pointer;
}
.rail-toggle svg{width:18px;height:18px;flex-shrink:0}
.rail-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;flex-direction:column;gap:12px;
}
.topbar-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title h2{font-size:20px}
.page-title p{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.role-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:100px;
  background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;
}
.role-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-select, .filter-search{
  padding:8px 12px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-primary);
  cursor:pointer;
}
.filter-search{cursor:text;font-weight:500;min-width:200px}
.filter-search::placeholder{color:var(--text-muted);font-weight:400}
.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:100px;border:1px solid var(--border-strong);
  background:var(--surface);font-size:11.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--text-primary);color:var(--surface);border-color:var(--text-primary)}
.btn{
  padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);
  font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2f74cc}
.btn svg{width:14px;height:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.content{padding:22px 28px 60px;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%;margin:0 auto}

/* ===== KPI cards ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);
}
.kpi-label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between}
.kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-0.01em}
.kpi-sub{font-size:11.5px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;padding:2px 6px;border-radius:6px;font-size:11px}
.delta.up{background:var(--critical-soft);color:var(--critical)}
.delta.down{background:var(--good-soft);color:var(--good)}
.delta.flat{background:var(--surface-3);color:var(--text-muted)}

/* ===== Panels ===== */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px 20px;box-shadow:var(--shadow-sm);
}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-head h3{font-size:14.5px}
.panel-head .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-secondary)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ===== Charts (generic) ===== */
.chart-wrap{position:relative;width:100%}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.chart-svg .grid-line{stroke:var(--grid);stroke-width:1}
.chart-svg .baseline{stroke:var(--baseline);stroke-width:1}
.chart-svg .axis-label{fill:var(--text-muted);font-size:10.5px;font-family:var(--font-body)}
.chart-svg .bar-label{fill:var(--text-secondary);font-size:10.5px;font-family:var(--font-mono);font-weight:500}
.chart-svg .cat-label{fill:var(--text-secondary);font-size:11px;font-family:var(--font-body);font-weight:600}
.bar-rect{cursor:pointer;transition:opacity .1s}
.bar-rect:hover{opacity:.82}
.hover-crosshair{stroke:var(--text-muted);stroke-width:1;stroke-dasharray:3 3;pointer-events:none;opacity:0}
.tooltip{
  position:absolute;pointer-events:none;background:var(--text-primary);color:var(--page);
  padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;box-shadow:var(--shadow-md);
  opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap;
}
.tooltip.show{opacity:1}
.tooltip .t-row{display:flex;align-items:center;gap:6px;justify-content:space-between;gap:14px}
.tooltip .t-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.tooltip .t-title{font-weight:700;margin-bottom:4px;font-family:var(--font-mono)}

/* aging pill */
.aging-pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:100px;
  font-size:11px;font-weight:700;white-space:nowrap;
}
.aging-pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-pill{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;
  background:var(--surface-3);color:var(--text-secondary);white-space:nowrap;
}
.status-pill.delivery{background:var(--accent-soft);color:var(--accent)}
.status-pill.sales{background:var(--accent-2-soft);color:var(--accent-2)}

/* ===== Table ===== */
.table-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:920px}
table.data-table thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 12px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  font-weight:700;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;
}
table.data-table thead th:hover{color:var(--text-primary)}
table.data-table thead th .sort-arrow{margin-left:4px;opacity:.5;font-size:9px}
table.data-table thead th.sorted .sort-arrow{opacity:1;color:var(--accent)}
table.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.data-table tbody tr:hover{background:var(--surface-2)}
table.data-table tbody tr:last-child td{border-bottom:none}
.cell-amount{font-family:var(--font-mono);font-weight:600;text-align:right}
.cell-muted{color:var(--text-muted)}
.table-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11.5px;color:var(--text-muted);flex-wrap:wrap;gap:8px}

/* ===== Upload panel ===== */
.upload-zone{
  border:2px dashed var(--border-strong);border-radius:12px;padding:32px 20px;text-align:center;
  cursor:pointer;transition:border-color .15s, background .15s;
}
.upload-zone:hover, .upload-zone.drag{border-color:var(--accent);background:var(--accent-soft)}
.upload-zone svg{width:30px;height:30px;color:var(--text-muted);margin-bottom:10px}
.upload-zone .u-title{font-weight:700;font-size:13.5px;margin-bottom:3px}
.upload-zone .u-sub{font-size:12px;color:var(--text-muted)}
.upload-log{margin-top:14px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary);
  background:var(--surface-2);border-radius:9px;padding:10px 12px;display:none;white-space:pre-wrap;line-height:1.6}
.upload-log.show{display:block}
.banner{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
  margin-bottom:14px;
}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.good{background:var(--good-soft);color:var(--good)}
.banner.warn{background:var(--warning-soft);color:var(--warning)}
.banner svg{width:15px;height:15px;flex-shrink:0}

/* ===== Reason x Aging pivot ===== */
table.pivot-table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
table.pivot-table th, table.pivot-table td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.pivot-table thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:right;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);font-weight:700;
}
table.pivot-table thead th:first-child{text-align:left;left:0;z-index:2}
table.pivot-table thead th .pv-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
table.pivot-table tbody th{
  position:sticky;left:0;background:var(--surface);text-align:left;font-weight:600;color:var(--text-primary);
  max-width:220px;overflow:hidden;text-overflow:ellipsis;z-index:1;border-right:1px solid var(--border);
}
table.pivot-table tbody tr:hover th, table.pivot-table tbody tr:hover td{background:var(--surface-2)}
table.pivot-table td{text-align:right;font-family:var(--font-mono);color:var(--text-secondary)}
table.pivot-table td.pv-empty{color:var(--text-muted);opacity:.5}
table.pivot-table tfoot th, table.pivot-table tfoot td{
  border-top:2px solid var(--border-strong);border-bottom:none;font-weight:700;color:var(--text-primary);
  position:sticky;bottom:0;background:var(--surface-2);
}
table.pivot-table tfoot th{left:0;z-index:2}
table.pivot-table td.pv-total, table.pivot-table th.pv-total{font-weight:700;color:var(--text-primary);border-left:1px solid var(--border-strong)}

/* credentials table (owner) */
.cred-table{width:100%;border-collapse:collapse;font-size:12px}
.cred-table th{text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border)}
.cred-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.cred-table tr:last-child td{border-bottom:none}

/* toast */
#toast-host{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{
  background:var(--text-primary);color:var(--page);padding:11px 14px;border-radius:10px;font-size:12.5px;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;animation:toast-in .18s ease-out;
}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media (max-width:880px){
  .rail{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;z-index:40;box-shadow:var(--shadow-pop)}
  .rail.open{transform:translateX(0)}
  .rail-toggle{display:flex}
  .rail-scrim.show{display:block}
  .topbar{padding:14px 16px 14px 60px}
  .content{padding:16px 16px 50px}
  .grid-3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

   Utilities

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(function(c){ if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtIDR(n){
  if(n == null || isNaN(n)) return 'Rp 0';
  var sign = n < 0 ? '-' : '';
  n = Math.abs(Math.round(n));
  return sign + 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function fmtCompact(n){
  var sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if(n >= 1e9) return sign + (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'') + ' M';
  if(n >= 1e6) return sign + (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'') + ' Jt';
  if(n >= 1e3) return sign + (n/1e3).toFixed(0) + ' Rb';
  return sign + n.toFixed(0);
}
function fmtInt(n){ return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
var EPOCH = new Date(DATA.epoch + 'T00:00:00Z');
function serialToDate(s){ var d = new Date(EPOCH.getTime()); d.setUTCDate(d.getUTCDate() + s); return d; }
var MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtDateShort(serial){
  var d = serialToDate(serial);
  return d.getUTCDate() + ' ' + MONTHS_ID[d.getUTCMonth()];
}
function fmtDateFull(serial){
  var d = serialToDate(serial);
  return d.getUTCDate() + ' ' + MONTHS_ID[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* ============================================================
   Filters / derived state
   ============================================================ */
var FILTERS = {
  vendor: 'all',      // 'all' | vendor index
  status: 'all',      // 'all' | 0 | 1
  aging: null,        // Set of 1..7, null = all
  range: '90',        // 'all' | '30' | '90' | '180'
  search: ''
};
var TABLE_SORT = { col: 'amount', dir: 'desc' };
var TABLE_LIMIT = 100;
var CURRENT_PAGE = 'dashboard';

function maxDateSerial(){
  var m = -Infinity;
  for(var i=0;i<DATA.records.length;i++) if(DATA.records[i][1] > m) m = DATA.records[i][1];
  return m === -Infinity ? 0 : m;
}

function scopedRecords(){
  // role scoping only (used as the base for vendor filter dropdown & charts that must not leak other vendors)
  if(SESSION.role === 'vendor'){
    var vi = findVendorIndex(SESSION.vendorRaw);
    // Vendors only ever see documents with Status Surat Jalan = PENDING DELIVERY (status code 0).
    return DATA.records.filter(function(r){ return r[0] === vi && r[3] === 0; });
  }
  return DATA.records;
}

function filteredRecords(){
  var recs = scopedRecords();
  var vendorFilter = SESSION.role === 'vendor' ? null : (FILTERS.vendor === 'all' ? null : FILTERS.vendor);
  var maxD = maxDateSerial();
  var rangeMin = null;
  if(FILTERS.range === '30') rangeMin = maxD - 30;
  else if(FILTERS.range === '90') rangeMin = maxD - 90;
  else if(FILTERS.range === '180') rangeMin = maxD - 180;
  var search = FILTERS.search.trim().toLowerCase();

  return recs.filter(function(r){
    if(vendorFilter !== null && r[0] !== vendorFilter) return false;
    if(FILTERS.status !== 'all' && r[3] !== FILTERS.status) return false;
    if(FILTERS.aging && !FILTERS.aging.has(r[4])) return false;
    if(rangeMin !== null && r[1] < rangeMin) return false;
    if(search){
      var hay = (DATA.vendors[r[0]] + ' ' + r[7] + ' ' + r[8] + ' ' + DATA.reasons[r[6]]).toLowerCase();
      if(hay.indexOf(search) === -1) return false;
    }
    return true;
  });
}

function aggregate(recs){
  var byBucket = [0,0,0,0,0,0,0,0]; // 1-indexed use 1..7
  var byVendor = {}, byReason = {}, byDate = {}, byStatus = [0,0,0];
  var total = 0, count = recs.length;
  recs.forEach(function(r){
    var vendor=r[0], date=r[1], amt=r[2], status=r[3], bucket=r[4], reason=r[6];
    total += amt;
    byBucket[bucket] += amt;
    byVendor[vendor] = (byVendor[vendor]||0) + amt;
    byReason[reason] = (byReason[reason]||0) + amt;
    byStatus[status] = (byStatus[status]||0) + amt;
    if(!byDate[date]) byDate[date] = [0,0,0,0,0,0,0,0];
    byDate[date][bucket] += amt;
  });
  return { total:total, count:count, byBucket:byBucket, byVendor:byVendor, byReason:byReason, byDate:byDate, byStatus:byStatus };
}

   SVG chart helpers

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  var e = document.createElementNS(SVGNS, tag);
  if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function niceMax(v){
  if(v <= 0) return 10;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var n = v / mag;
  var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * mag;
}

/* ---- Stacked area trend chart ---- */
function renderTrendChart(container, recs){
  container.innerHTML = '';
  var agg = aggregate(recs);
  var dates = Object.keys(agg.byDate).map(Number).sort(function(a,b){return a-b;});
  var W = 960, H = 260, padL = 52, padR = 16, padT = 16, padB = 30;
  var innerW = W - padL - padR, innerH = H - padT - padB;

  var wrap = el('div', {class:'chart-wrap'});
  var tooltip = el('div', {class:'tooltip'});
  wrap.appendChild(tooltip);

  if(dates.length === 0){
    wrap.appendChild(el('div', {style:'padding:40px;text-align:center;color:var(--text-muted);font-size:12.5px'}, ['Tidak ada data pada rentang filter ini.']));
    container.appendChild(wrap);
    return;
  }

  // totals per date for y scale
  var totals = dates.map(function(d){ return agg.byDate[d].reduce(function(a,b){return a+b;},0); });
  var yMax = niceMax(Math.max.apply(null, totals) * 1.12 || 10);
  var xMin = dates[0], xMax = dates[dates.length-1];
  var xSpan = Math.max(1, xMax - xMin);

  function xPos(d){ return padL + (dates.length===1 ? innerW/2 : (d - xMin) / xSpan * innerW); }
  function yPos(v){ return padT + innerH - (v / yMax * innerH); }

  var svg = svgEl('svg', {class:'chart-svg', viewBox:'0 0 '+W+' '+H, preserveAspectRatio:'none', width:'100%', height:H});

  // gridlines + y labels
  var ticks = 4;
  for(var i=0;i<=ticks;i++){
    var v = yMax / ticks * i;
    var y = yPos(v);
    svg.appendChild(svgEl('line', {class:'grid-line', x1:padL, x2:W-padR, y1:y, y2:y}));
    var lbl = svgEl('text', {class:'axis-label', x:padL-8, y:y+3, 'text-anchor':'end'});
    lbl.textContent = fmtCompact(v);
    svg.appendChild(lbl);
  }

  // stacked areas (bucket 1..7)
  var cum = dates.map(function(){ return 0; });
  for(var b=1;b<=7;b++){
    var topPts = [], basePts = [];
    dates.forEach(function(d, idx){
      var v = agg.byDate[d][b];
      var base = cum[idx];
      var top = base + v;
      cum[idx] = top;
      topPts.push([xPos(d), yPos(top)]);
      basePts.push([xPos(d), yPos(base)]);
    });
    var pathD = 'M' + topPts.map(function(p){return p[0]+','+p[1];}).join('L');
    pathD += 'L' + basePts.slice().reverse().map(function(p){return p[0]+','+p[1];}).join('L') + 'Z';
    var path = svgEl('path', {d:pathD, fill:'var('+RISK_VARS[b-1]+')', opacity:'0.88'});
    svg.appendChild(path);
  }

  // baseline + x labels (sparse)
  svg.appendChild(svgEl('line', {class:'baseline', x1:padL, x2:W-padR, y1:padT+innerH, y2:padT+innerH}));
  var labelEvery = Math.max(1, Math.ceil(dates.length / 7));
  dates.forEach(function(d, idx){
    if(idx % labelEvery === 0 || idx === dates.length-1){
      var t = svgEl('text', {class:'axis-label', x:xPos(d), y:H-8, 'text-anchor':'middle'});
      t.textContent = fmtDateShort(d);
      svg.appendChild(t);
    }
  });

  // hover crosshair
  var crossLine = svgEl('line', {class:'hover-crosshair', y1:padT, y2:padT+innerH});
  svg.appendChild(crossLine);
  var hoverDot = svgEl('circle', {r:3.5, fill:'var(--text-primary)', opacity:0, stroke:'var(--surface)', 'stroke-width':2});
  svg.appendChild(hoverDot);

  var overlay = svgEl('rect', {x:padL, y:padT, width:innerW, height:innerH, fill:'transparent', style:'cursor:crosshair'});
  svg.appendChild(overlay);

  function nearestIdx(mx){
    var best=0, bd=Infinity;
    dates.forEach(function(d, idx){
      var dx = Math.abs(xPos(d) - mx);
      if(dx < bd){ bd = dx; best = idx; }
    });
    return best;
  }
  function showTip(evt){
    var rect = svg.getBoundingClientRect();
    var scaleX = W / rect.width;
    var mx = (evt.clientX - rect.left) * scaleX;
    var idx = nearestIdx(mx);
    var d = dates[idx];
    var x = xPos(d);
    crossLine.setAttribute('x1', x); crossLine.setAttribute('x2', x); crossLine.style.opacity = 1;
    hoverDot.setAttribute('cx', x); hoverDot.setAttribute('cy', yPos(totals[idx])); hoverDot.style.opacity = 1;
    var rows = '';
    for(var b=7;b>=1;b--){
      var v = agg.byDate[d][b];
      if(!v) continue;
      rows += '<div class="t-row"><span style="display:flex;align-items:center;gap:6px"><span class="t-sw" style="background:var('+RISK_VARS[b-1]+')"></span>'+AGING_SHORT[b-1]+'</span><span class="tnum">'+fmtCompact(v)+'</span></div>';
    }
    tooltip.innerHTML = '<div class="t-title">'+fmtDateFull(d)+' &middot; Total '+fmtCompact(totals[idx])+'</div>' + rows;
    var cw = wrap.clientWidth;
    var leftPct = (x / W) * cw;
    tooltip.style.left = Math.min(Math.max(leftPct, 90), cw-90) + 'px';
    tooltip.style.top = '4px';
    tooltip.style.transform = 'translateX(-50%)';
    tooltip.classList.add('show');
  }
  function hideTip(){
    crossLine.style.opacity = 0; hoverDot.style.opacity = 0; tooltip.classList.remove('show');
  }
  overlay.addEventListener('mousemove', showTip);
  overlay.addEventListener('mouseleave', hideTip);
  overlay.addEventListener('touchstart', function(e){ showTip(e.touches[0]); }, {passive:true});
  overlay.addEventListener('touchmove', function(e){ showTip(e.touches[0]); }, {passive:true});
  overlay.addEventListener('touchend', hideTip);

  wrap.appendChild(svg);
  container.appendChild(wrap);
}

    colTotals[bucket-1] += amt;
    grandTotal += amt;
  });
  var rows = Object.keys(byReason).map(function(k){
    var vals = byReason[k];

  }).sort(function(a,b){ return b.total - a.total; });

/* ============================================================
   KPIs
   ============================================================ */
function computeProgress(recs){
  var agg = aggregate(recs);
  var dates = Object.keys(agg.byDate).map(Number).sort(function(a,b){return a-b;});
  if(dates.length < 2) return null;
  var last = dates[dates.length-1], prev = dates[dates.length-2];
  var lastTotal = agg.byDate[last].reduce(function(a,b){return a+b;},0);
  var prevTotal = agg.byDate[prev].reduce(function(a,b){return a+b;},0);
  return { last:last, prev:prev, lastTotal:lastTotal, prevTotal:prevTotal, delta: lastTotal - prevTotal };
}

function renderKPIs(container, recs){
  var agg = aggregate(recs);
  var progress = computeProgress(recs);
  var critical = agg.byBucket[5]+agg.byBucket[6]+agg.byBucket[7];
  var criticalPct = agg.total ? (critical/agg.total*100) : 0;
  // r layout: [vendorIdx, dateSerial, amt, status, bucket, agingDays, reasonIdx, shipTo, deliv]
  var sumAging = 0;
  recs.forEach(function(r){ sumAging += r[5]; });
  var avgDays = recs.length ? Math.round(sumAging / recs.length) : 0;

  container.innerHTML = '';
  var fourthCard;
  if(SESSION.role === 'vendor'){
    var maxAging = recs.length ? Math.max.apply(null, recs.map(function(r){ return r[5]; })) : 0;
    var avgPerDoc = recs.length ? agg.total / recs.length : 0;
    fourthCard = { label:'Rata-rata / Dokumen', value: fmtIDR(avgPerDoc), sub: 'dokumen tertua: '+maxAging+' hari' };
  } else {
    fourthCard = { label:'Pending Delivery', value: fmtIDR(agg.byStatus[0]||0), sub: 'vs Pending Sales '+fmtCompact(agg.byStatus[1]||0) };
  }
  var cards = [
    { label:'Total Outstanding', value: fmtIDR(agg.total), sub: fmtInt(agg.count)+' dokumen', deltaHtml: progressChip(progress) },
    { label:'>90 Hari (Kritis)', value: fmtIDR(critical), sub: criticalPct.toFixed(1)+'% dari total', accent:'critical' },
    { label:'Rata-rata Aging', value: avgDays + ' hari', sub: 'seluruh dokumen ter-filter' },
    fourthCard
  ];
  cards.forEach(function(c){
    var card = el('div', {class:'kpi-card'});
    card.appendChild(el('div', {class:'kpi-label'}, [c.label]));
    var valEl = el('div', {class:'kpi-value tnum'}, [c.value]);
    if(c.accent === 'critical') valEl.style.color = 'var(--critical)';
    card.appendChild(valEl);
    var sub = el('div', {class:'kpi-sub'});
    sub.appendChild(document.createTextNode(c.sub));
    if(c.deltaHtml) sub.innerHTML += c.deltaHtml;
    card.appendChild(sub);
    container.appendChild(card);
  });
}
function progressChip(p){
  if(!p) return '';
  var up = p.delta > 0;
  var flat = Math.abs(p.delta) < 1;
  var cls = flat ? 'flat' : (up ? 'up' : 'down');
  var arrow = flat ? '→' : (up ? '↑' : '↓');
  return ' <span class="delta '+cls+'">'+arrow+' '+fmtCompact(Math.abs(p.delta))+'</span> <span style="color:var(--text-muted)">vs '+fmtDateShort(p.prev)+'</span>';
}

/* ============================================================
   Table
   ============================================================ */
var TABLE_COL_IDX = { vendor:0, date:1, amount:2, status:3, bucket:4, aging:5, reason:6 };
function sortRecords(recs){
  var col = TABLE_SORT.col, dir = TABLE_SORT.dir === 'asc' ? 1 : -1;
  var idx = TABLE_COL_IDX[col];
  return recs.slice().sort(function(a,b){
    var va, vb;
    if(col === 'vendor'){ va = DATA.vendors[a[0]]; vb = DATA.vendors[b[0]]; }
    else if(col === 'reason'){ va = DATA.reasons[a[6]]; vb = DATA.reasons[b[6]]; }
    else { va = a[idx]; vb = b[idx]; }
    if(va < vb) return -1*dir;
    if(va > vb) return 1*dir;
    return 0;
  });
}
function renderTable(container, recs){
  container.innerHTML = '';
  var sorted = sortRecords(recs);
  var showVendorCol = SESSION.role !== 'vendor';
  var slice = sorted.slice(0, TABLE_LIMIT);

  var foot = el('div', {class:'table-foot'});
  foot.appendChild(el('span', {}, ['Menampilkan '+fmtInt(slice.length)+' dari '+fmtInt(sorted.length)+' dokumen']));
  if(sorted.length > TABLE_LIMIT){
    var more = el('button', {class:'btn'}, ['Tampilkan 100 lagi']);
    more.addEventListener('click', function(){ TABLE_LIMIT += 100; renderAll(); });
    foot.appendChild(more);
  }
  container.appendChild(foot);

function toast(msg, kind){
  var host = $('#toast-host');

  var t = el('div', {class:'toast'}, [msg]);
  if(kind === 'error') t.style.background = 'var(--critical)';

  host.appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); }, 300); }, 3800);
}

/* ============================================================
   Excel parsing + transform (mirrors the original data build)
   ============================================================ */
var AGING_GROUP_LIST = AGING_LABELS;
var STATUS_MAP = {'PENDING DELIVERY':0, 'PENDING SALES':1};
function excelSerialToDate(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    var utc = Math.round((v - 25569) * 86400 * 1000);
    return new Date(utc);
  }
  return null;
}
function cleanVendorName(v){
  v = String(v).trim().replace(/^(PT\.\s*)+/i, 'PT. ');
  return v.split(/\s+/).map(function(w){
    return (w === w.toUpperCase() && w.length > 3 && w !== 'PT.') ? (w.charAt(0)+w.slice(1).toLowerCase()) : w;
  }).join(' ');
}
function transformRows(rows){
  var header = rows[0].map(function(h){ return (h||'').toString().trim(); });
  function col(name){ return header.indexOf(name); }
  var iVendor = col('Vendor Name'), iRDate = col('Received Date'), iDODate = col('Delivery Order Date'),
      iAmt = col('Net Amount POD'), iStatus = col('Status Surat Jalan'), iAgGroup = col('Aging Group'),
      iAgDays = col('Aging'), iReason = col('Reason'), iShipTo = col('Name of ship-to party'), iDeliv = col('Delivery');
  if(iVendor<0 || iAmt<0 || iStatus<0 || iAgGroup<0){
    throw new Error('Format kolom tidak dikenali. Pastikan file memiliki kolom "Vendor Name", "Net Amount POD", "Status Surat Jalan", dan "Aging Group".');
  }
  var vendors = [], vendorIdx = {}, reasons = [], reasonIdx = {}, records = [];
  var epoch = EPOCH;
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    if(!row) continue;
    var vendor = row[iVendor] ? cleanVendorName(row[iVendor]) : 'Unassigned';
    var rdateRaw = (iDODate>=0 ? row[iDODate] : null) || (iRDate>=0 ? row[iRDate] : null);
    var amt = row[iAmt];
    var status = row[iStatus];
    var ag = row[iAgGroup];
    if(!rdateRaw || amt === null || amt === undefined || amt === '' || !status || !ag || AGING_GROUP_LIST.indexOf(ag) === -1) continue;
    var rdate = excelSerialToDate(rdateRaw);
    if(!rdate) continue;
    if(!(vendor in vendorIdx)){ vendorIdx[vendor] = vendors.length; vendors.push(vendor); }
    var reason = (iReason>=0 ? row[iReason] : null) || 'Tidak Ada Keterangan';
    if(!(reason in reasonIdx)){ reasonIdx[reason] = reasons.length; reasons.push(reason); }
    var dserial = Math.round((Date.UTC(rdate.getUTCFullYear(), rdate.getUTCMonth(), rdate.getUTCDate()) - epoch.getTime()) / 86400000);
    var agDays = iAgDays>=0 ? Math.round(row[iAgDays]||0) : 0;
    var agGroupIdx = AGING_GROUP_LIST.indexOf(ag) + 1;
    records.push([
      vendorIdx[vendor], dserial, Math.round(amt), (STATUS_MAP[status] !== undefined ? STATUS_MAP[status] : 2),
      agGroupIdx, agDays, reasonIdx[reason],
      iShipTo>=0 ? (row[iShipTo]||'') : '', iDeliv>=0 ? (row[iDeliv]||'') : ''
    ]);
  }
  if(records.length === 0) throw new Error('Tidak ada baris valid yang bisa dibaca dari file ini.');
  return { epoch: DATA.epoch, vendors:vendors, reasons:reasons, agingGroups: AGING_GROUP_LIST, statusLabels:['PENDING DELIVERY','PENDING SALES','OTHER'], records:records, updatedAt: new Date().toISOString(), updatedBy: SESSION.display };
}

  return '<!doctype html>\n<html lang="id">\n<head>' + head + '</head>\n<body>' + body + '</body>\n</html>';
}

function persistData(newData){
  DATA = newData;
  saveLocalData();
  var full = buildFullDocument(newData);
  if(!window.claude || !window.claude.use){
    toast('Data diperbarui di perangkat ini. (Di luar Claude, pembaruan tidak tersinkron ke perangkat lain.)', 'good');
    return;
  }
  window.claude.use('artifact').then(function(artifact){
    if(!artifact){ toast('Data diperbarui di perangkat ini saja — sinkronisasi tidak tersedia di tampilan ini.', 'good'); return; }
    artifact.publish(full).then(function(){
      toast('Berhasil dipublikasikan — semua orang yang membuka tautan ini kini melihat data terbaru.', 'good');
    }).catch(function(err){
      var code = err && err.code;
      if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
        toast('Data diperbarui di perangkat ini saja. Untuk mempublikasikan ke semua orang, minta pemilik tautan memberi akses edit, atau minta mereka yang mengunggah.', 'good');
      } else if(code === 'conflict'){
        toast('Ada versi lain yang baru saja dipublikasikan — memuat ulang…', 'good');
      } else {
        toast('Data diperbarui di perangkat ini. Publikasi otomatis gagal ('+(code||'error')+').', 'error');
      }
    });
  }).catch(function(){
    toast('Data diperbarui di perangkat ini saja.', 'good');
  });
}

function handleFile(file){
  var logEl = $('#upload-log');
  logEl.classList.add('show');
  logEl.textContent = 'Membaca '+file.name+'…';
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      logEl.textContent += '\n'+rows.length+' baris ditemukan. Memproses…';
      var newData = transformRows(rows);
      logEl.textContent += '\nBerhasil: '+newData.records.length+' dokumen, '+newData.vendors.length+' vendor, '+newData.reasons.length+' kategori.';
      persistData(newData);
      TABLE_LIMIT = 100;
      renderAll();
    }catch(err){
      logEl.textContent += '\nGagal: '+(err.message || err);
      toast('Gagal memproses file: '+(err.message||err), 'error');
    }
  };
  reader.onerror = function(){ logEl.textContent += '\nGagal membaca file.'; };
  reader.readAsArrayBuffer(file);
}

function renderUploadPage(){
  var wrap = $('#upload-zone');
  var input = $('#upload-input');
  wrap.onclick = function(){ input.click(); };
  input.onchange = function(){ if(input.files[0]) handleFile(input.files[0]); };
  ['dragover','dragenter'].forEach(function(ev){
    wrap.addEventListener(ev, function(e){ e.preventDefault(); wrap.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    wrap.addEventListener(ev, function(e){ e.preventDefault(); wrap.classList.remove('drag'); });
  });
  wrap.addEventListener('drop', function(e){
    var f = e.dataTransfer.files[0];
    if(f) handleFile(f);
  });
  $('#upload-meta').textContent = (DATA.updatedAt ? ('Data terakhir diperbarui: ' + fmtDateFull(Math.round((new Date(DATA.updatedAt)-EPOCH)/86400000)) + (DATA.updatedBy ? ' oleh '+DATA.updatedBy : '')) : 'Menggunakan data awal bawaan.');
}

/* ============================================================
   Export CSV — plain browser download (Blob + <a download>).
   Works when this page is opened as a regular HTML file / hosted
   on any web server. (Not used inside the claude.ai artifact
   sandbox, which blocks self-initiated downloads — this page is
   meant to be hosted or opened directly.)
   ============================================================ */
function exportCSV(recs){
  var header = ['Delivery Order Date','Vendor','No. Delivery','Ship-To','Reason','Aging Group','Aging (hari)','Status Surat Jalan','Net Amount POD'];
  var lines = [header.join(',')];
  recs.forEach(function(r){
    var row = [
      fmtDateFull(r[1]), '"'+DATA.vendors[r[0]].replace(/"/g,'""')+'"', r[8]||'',
      '"'+(r[7]||'').replace(/"/g,'""')+'"', '"'+DATA.reasons[r[6]].replace(/"/g,'""')+'"',
      AGING_LABELS[r[4]-1], r[5], STATUS_LABELS[r[3]]||'', r[2]
    ];
    lines.push(row.join(','));
  });
  var csv = '﻿' + lines.join('\r\n');
  try{
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'sbni-export-' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('File CSV diunduh ('+fmtInt(recs.length)+' baris).', 'good');
  }catch(err){
    toast('Gagal mengekspor CSV: ' + (err.message||err), 'error');
  }
}

/* ============================================================
   Navigation / shell
   ============================================================ */
function navItemsForRole(role){
  var items = [{key:'dashboard', label:'Dashboard', icon:'dashboard'}];
  if(role === 'admin' || role === 'owner') items.push({key:'upload', label:'Upload Data', icon:'upload'});
  if(role === 'owner') items.push({key:'access', label:'Akses Vendor', icon:'key'});
  return items;
}
function renderNav(){
  var nav = $('#rail-nav');
  nav.innerHTML = '';
  navItemsForRole(SESSION.role).forEach(function(item){
    var link = el('a', {class:'rail-link'+(CURRENT_PAGE===item.key?' active':''), html: ICONS[item.icon] + '<span>'+item.label+'</span>'});
    link.addEventListener('click', function(){ CURRENT_PAGE = item.key; renderAll(); closeMobileRail(); });
    nav.appendChild(link);
  });
}
function closeMobileRail(){ $('#rail').classList.remove('open'); $('#rail-scrim').classList.remove('show'); }

function pageTitleFor(page){
  if(page === 'dashboard') return ['Ringkasan Aging SBNI', 'Pantau outstanding Net Amount POD berdasarkan usia dokumen'];
  if(page === 'upload') return ['Upload Data', 'Unggah file Excel terbaru untuk memperbarui seluruh dashboard'];
  if(page === 'access') return ['Akses Vendor', 'Kelola kredensial login untuk setiap vendor'];
  return ['', ''];
}

function renderAll(){
  var recs = filteredRecords();
  var titles = pageTitleFor(CURRENT_PAGE);
  $('#page-title-h').textContent = titles[0];
  $('#page-title-p').textContent = titles[1];
  $('#role-pill-text').textContent = SESSION.role;

  $('#page-dashboard').classList.toggle('hidden', CURRENT_PAGE!=='dashboard');
  $('#page-upload').classList.toggle('hidden', CURRENT_PAGE!=='upload');
  $('#page-access').classList.toggle('hidden', CURRENT_PAGE!=='access');
  $('#topbar-filters').classList.toggle('hidden', CURRENT_PAGE!=='dashboard');
  $('#aging-chips-row').classList.toggle('hidden', CURRENT_PAGE!=='dashboard');

  renderNav();

  if(CURRENT_PAGE === 'dashboard'){
    renderTopbarFilters();
    renderAgingChips();
    renderDashboardPage(recs);
  } else if(CURRENT_PAGE === 'upload'){
    renderUploadPage();
  } else if(CURRENT_PAGE === 'access'){
    renderAccessPage();
  }
}

/* ============================================================
   Boot / login flow
   ============================================================ */
function showApp(){
  $('#login-screen').classList.add('hidden');
  $('#app-shell').classList.remove('hidden');
  $('#user-avatar').textContent = (SESSION.display||'?').slice(0,2).toUpperCase();
  $('#user-name').textContent = SESSION.display;
  $('#user-role').textContent = SESSION.role;
  CURRENT_PAGE = 'dashboard';
  renderAll();
}
function showLogin(err){
  $('#app-shell').classList.add('hidden');
  $('#login-screen').classList.remove('hidden');
  var errEl = $('#login-error');
  if(err){ errEl.textContent = err; errEl.classList.add('show'); }
  else { errEl.classList.remove('show'); }
}

function initLoginForm(){
  var form = $('#login-form');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var u = $('#login-username').value, p = $('#login-password').value;
    var sess = attemptLogin(u, p);
    if(!sess){ showLogin('Username atau password salah. Silakan coba lagi.'); return; }
    SESSION = sess;
    saveSession();
    showApp();
  });
  $('#logout-btn').addEventListener('click', function(){ clearSession(); location.reload(); });
}

function initChrome(){
  $('#rail-toggle').addEventListener('click', function(){
    $('#rail').classList.add('open'); $('#rail-scrim').classList.add('show');
  });
  $('#rail-scrim').addEventListener('click', closeMobileRail);
  $('#export-csv-btn').addEventListener('click', function(){ exportCSV(filteredRecords()); });
}

function boot(){
  var mount = document.getElementById('mount');
  var shellTpl = document.getElementById('shell-template');
  if(mount && shellTpl) mount.innerHTML = shellTpl.innerHTML;
  loadLocalDataIfNewer();
  loadSession();
  initLoginForm();
  initChrome();
  var bootEl = document.getElementById('boot-loading');
  if(bootEl) bootEl.classList.add('hidden');
  if(SESSION){
    // revalidate vendorRaw still exists (in case a fresh upload changed the vendor list) — non-blocking
    showApp();
  } else {
    showLogin();
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
</body>
